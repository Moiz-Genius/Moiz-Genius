<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 345" width="100%" height="345" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>

    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="border-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.45" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <style>
    .node-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      letter-spacing: 1px;
    }
    .node-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #cbd5e1;
    }
    .bullet-text {
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      font-size: 11.5px;
      fill: #cbd5e1;
    }
    .edge-label {
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      font-weight: 600;
      font-size: 10.5px;
      fill: #94a3b8;
      letter-spacing: 0.4px;
    }
    .provider-sub {
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      font-size: 10px;
      fill: #94a3b8;
    }
  </style>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="876" height="341" rx="14" fill="url(#bg)" stroke="url(#border-outer)" stroke-width="1.2" />
  <rect x="2" y="2" width="876" height="341" rx="14" fill="url(#grid)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="440" cy="180" r="160" fill="#38bdf8" fill-opacity="0.04">
    <animate attributeName="fill-opacity" values="0.03;0.07;0.03" dur="4.5s" repeatCount="indefinite" />
  </circle>

  <!-- Connector Paths -->
  <!-- Discord -> OpenClaw -->
  <line x1="440" y1="86" x2="440" y2="128" stroke="#5865F2" stroke-opacity="0.55" stroke-width="1.8" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" from="14" to="0" dur="1.2s" repeatCount="indefinite" />
  </line>
  <polygon points="435,123 445,123 440,130" fill="#38bdf8" />
  <rect x="450" y="97" width="86" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
  <text x="493" y="109" text-anchor="middle" class="edge-label">Bot Gateway</text>

  <!-- OpenClaw -> Providers (Static Dashed Rails) -->
  <path d="M 440 234 L 440 256 L 175 256 L 175 278" fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" from="14" to="0" dur="1.4s" repeatCount="indefinite" />
  </path>
  <line x1="440" y1="234" x2="440" y2="278" stroke="#818cf8" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" from="14" to="0" dur="1.4s" repeatCount="indefinite" />
  </line>
  <path d="M 440 234 L 440 256 L 705 256 L 705 278" fill="none" stroke="#22c55e" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" from="14" to="0" dur="1.4s" repeatCount="indefinite" />
  </path>

  <!-- Arrowheads -->
  <polygon points="170,273 180,273 175,280" fill="#38bdf8" />
  <polygon points="435,273 445,273 440,280" fill="#818cf8" />
  <polygon points="700,273 710,273 705,280" fill="#22c55e" />

  <rect x="450" y="238" width="108" height="16" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
  <text x="504" y="249" text-anchor="middle" class="edge-label">API Integrations</text>

  <!-- Traveling Data Packets -->
  <circle r="3.2" fill="#7dd3fc" filter="url(#glow)">
    <animateMotion path="M 440 86 L 440 128" dur="1.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="1.4s" repeatCount="indefinite" />
  </circle>
  <circle r="3.2" fill="#38bdf8" filter="url(#glow)">
    <animateMotion path="M 440 234 L 440 256 L 175 256 L 175 278" dur="2.1s" begin="0.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="2.1s" begin="0.2s" repeatCount="indefinite" />
  </circle>
  <circle r="3.2" fill="#a78bfa" filter="url(#glow)">
    <animateMotion path="M 440 234 L 440 278" dur="1.6s" begin="0.9s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="0.9s" repeatCount="indefinite" />
  </circle>
  <circle r="3.2" fill="#4ade80" filter="url(#glow)">
    <animateMotion path="M 440 234 L 440 256 L 705 256 L 705 278" dur="2.1s" begin="1.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="2.1s" begin="1.4s" repeatCount="indefinite" />
  </circle>

  <!-- Node 1: Discord Client -->
  <g transform="translate(220, 22)">
    <rect x="0" y="0" width="440" height="64" rx="10" fill="url(#card-bg)" stroke="#5865F2" stroke-opacity="0.7" stroke-width="1.4" />
    <circle cx="24" cy="24" r="4.5" fill="#5865F2" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="220" y="28" text-anchor="middle" fill="#a5b4fc" class="node-title">DISCORD CLIENT</text>
    <text x="220" y="48" text-anchor="middle" class="node-sub">Send task instructions via Discord messages</text>
  </g>

  <!-- Node 2: OpenClaw Agent (Linux Server) -->
  <g transform="translate(150, 130)">
    <rect x="0" y="0" width="580" height="104" rx="10" fill="url(#card-bg)" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.55;0.95;0.55" dur="3.5s" repeatCount="indefinite" />
    </rect>
    <circle cx="24" cy="24" r="4" fill="#22c55e" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="290" y="27" text-anchor="middle" fill="#38bdf8" class="node-title">OPENCLAW AGENT (LINUX SERVER)</text>
    <line x1="20" y1="38" x2="560" y2="38" stroke="#1e293b" stroke-width="1" />
    <text x="34" y="56" class="bullet-text">• Parses task intent &amp; maintains session context</text>
    <text x="34" y="74" class="bullet-text">• Routes requests across Gemini, DeepSeek &amp; OpenAI APIs</text>
    <text x="34" y="92" class="bullet-text">• Executes automated workflows &amp; returns results</text>
  </g>

  <!-- Provider 1: Google Gemini -->
  <g transform="translate(65, 280)">
    <rect x="0" y="0" width="220" height="48" rx="8" fill="url(#card-bg)" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.45;0.95;0.45" dur="2.1s" begin="0.8s" repeatCount="indefinite" />
    </rect>
    <circle cx="20" cy="24" r="3.5" fill="#38bdf8" />
    <text x="118" y="22" text-anchor="middle" fill="#7dd3fc" class="node-title">Google Gemini</text>
    <text x="118" y="38" text-anchor="middle" class="provider-sub">Gemini API Key</text>
  </g>

  <!-- Provider 2: DeepSeek API -->
  <g transform="translate(330, 280)">
    <rect x="0" y="0" width="220" height="48" rx="8" fill="url(#card-bg)" stroke="#818cf8" stroke-opacity="0.6" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.45;0.95;0.45" dur="2.1s" begin="1.4s" repeatCount="indefinite" />
    </rect>
    <circle cx="20" cy="24" r="3.5" fill="#818cf8" />
    <text x="118" y="22" text-anchor="middle" fill="#c4b5fd" class="node-title">DeepSeek API</text>
    <text x="118" y="38" text-anchor="middle" class="provider-sub">DeepSeek API Key</text>
  </g>

  <!-- Provider 3: OpenAI API -->
  <g transform="translate(595, 280)">
    <rect x="0" y="0" width="220" height="48" rx="8" fill="url(#card-bg)" stroke="#22c55e" stroke-opacity="0.6" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.45;0.95;0.45" dur="2.1s" begin="2.0s" repeatCount="indefinite" />
    </rect>
    <circle cx="20" cy="24" r="3.5" fill="#22c55e" />
    <text x="118" y="22" text-anchor="middle" fill="#86efac" class="node-title">OpenAI API</text>
    <text x="118" y="38" text-anchor="middle" class="provider-sub">OpenAI API Key</text>
  </g>
</svg>
