<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 156" width="100%" height="156" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>
  </defs>
  <rect x="1.5" y="1.5" width="427" height="153" rx="12" fill="url(#bg)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.3">
    <animate attributeName="stroke-opacity" values="0.35;0.85;0.35" dur="3.6s" begin="2.5s" repeatCount="indefinite" />
  </rect>
  <rect x="1.5" y="1.5" width="427" height="153" rx="12" fill="url(#g)" />
  <rect x="16" y="42" width="110" height="1.5" rx="0.75" fill="url(#sweep)">
    <animate attributeName="x" values="16;304;16" dur="4.5s" begin="2.5s" repeatCount="indefinite" />
  </rect>

  <!-- Header -->
  <circle cx="24" cy="24" r="4" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="2.5s" repeatCount="indefinite" />
  </circle>
  <text x="36" y="28.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="15.5" font-weight="700" fill="#f1f5f9">Wraith Agent Spec</text>

  <!-- Language Pill -->
  <rect x="318" y="14" width="96" height="20" rx="10" fill="#0f172a" stroke="#334155" stroke-width="0.9" />
  <circle cx="331" cy="24" r="3.5" fill="#a78bfa" />
  <text x="341" y="27.5" font-family="'JetBrains Mono',Consolas,monospace" font-size="10" font-weight="600" fill="#cbd5e1">Spec</text>

  <line x1="16" y1="43" x2="414" y2="43" stroke="#1e293b" stroke-width="0.9" />

  <!-- Description -->
  <text x="20" y="69" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="12.5" fill="#cbd5e1">Full architecture blueprint for a fast,</text>
  <text x="20" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="12.5" fill="#cbd5e1">local-first CLI autonomous coding agent.</text>

  <!-- Footer -->
  <line x1="16" y1="112" x2="414" y2="112" stroke="#1e293b" stroke-width="0.8" />
  <text x="20" y="135" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#94a3b8">Architecture • TypeScript • Node 20+</text>
  <rect x="326" y="121" width="88" height="22" rx="6" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="0.9" />
  <text x="370" y="135.5" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="10" font-weight="700" fill="#38bdf8">VIEW REPO →</text>
</svg>
