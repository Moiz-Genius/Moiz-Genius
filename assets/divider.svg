<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 4" width="880" height="4" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="div-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0" />
      <stop offset="20%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="div-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="0" y="1.5" width="880" height="1" fill="url(#div-base)" />
  <rect x="-180" y="1" width="180" height="2" rx="1" fill="url(#div-pulse)">
    <animate attributeName="x" values="-180;880" dur="4.5s" repeatCount="indefinite" />
  </rect>
</svg>