<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="280" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1122" />
      <stop offset="100%" stop-color="#0d172e" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="name-grad" x1="-100%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="75%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#38bdf8" />
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;300%" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="wave-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="wave-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="sweep-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="1" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow-cyan" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5" />
      <circle cx="32" cy="0" r="1" fill="#38bdf8" fill-opacity="0.35" />
    </pattern>

    <clipPath id="card-clip">
      <rect x="2" y="2" width="956" height="276" rx="16" />
    </clipPath>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .role-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: 0.4px;
      fill: #e2e8f0;
    }
    .status-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 1px;
      fill: #38bdf8;
    }
    .hire-text {
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      font-weight: 700;
      font-size: 10.5px;
      letter-spacing: 0.8px;
      fill: #4ade80;
    }
    .pill-label {
      font-family: 'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.4px;
      fill: #e2e8f0;
    }
    .coord-text {
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      font-size: 10px;
      fill: #64748b;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Clipped Background & Animated Waves -->
  <g clip-path="url(#card-clip)">
    <rect x="2" y="2" width="956" height="276" fill="url(#bg-grad)" />
    <rect x="2" y="2" width="956" height="276" fill="url(#grid)" />

    <!-- Breathing Ambient Orbs -->
    <circle cx="480" cy="110" r="190" fill="#38bdf8" fill-opacity="0.08" filter="url(#glow-cyan)">
      <animate attributeName="fill-opacity" values="0.05;0.13;0.05" dur="4s" repeatCount="indefinite" />
      <animate attributeName="r" values="175;205;175" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="180" cy="95" r="130" fill="#818cf8" fill-opacity="0.06" filter="url(#glow-cyan)">
      <animate attributeName="fill-opacity" values="0.03;0.09;0.03" dur="5.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="780" cy="145" r="150" fill="#22c55e" fill-opacity="0.05" filter="url(#glow-cyan)">
      <animate attributeName="fill-opacity" values="0.03;0.09;0.03" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Continuous Gliding Cyber Waves (1440px tiled seamless loop) -->
    <g>
      <path d="M 0 228 Q 120 202 240 228 T 480 228 T 720 228 T 960 228 T 1200 228 T 1440 228 L 1440 280 L 0 280 Z" fill="url(#wave-1)" />
      <path d="M 0 228 Q 120 202 240 228 T 480 228 T 720 228 T 960 228 T 1200 228 T 1440 228" fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.4" />
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-480 0" dur="6s" repeatCount="indefinite" />
    </g>
    <g>
      <path d="M 0 242 Q 120 264 240 242 T 480 242 T 720 242 T 960 242 T 1200 242 T 1440 242 L 1440 280 L 0 280 Z" fill="url(#wave-2)" />
      <path d="M 0 242 Q 120 264 240 242 T 480 242 T 720 242 T 960 242 T 1200 242 T 1440 242" fill="none" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2" />
      <animateTransform attributeName="transform" type="translate" from="-480 0" to="0 0" dur="8s" repeatCount="indefinite" />
    </g>

    <!-- Floating Particles -->
    <circle cx="140" cy="240" r="2.2" fill="#38bdf8" filter="url(#glow-subtle)">
      <animate attributeName="cy" values="255;75;255" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="310" cy="230" r="1.8" fill="#818cf8" filter="url(#glow-subtle)">
      <animate attributeName="cy" values="260;85;260" dur="5.5s" begin="1.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.85;0" dur="5.5s" begin="1.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="660" cy="240" r="2.2" fill="#38bdf8" filter="url(#glow-subtle)">
      <animate attributeName="cy" values="260;80;260" dur="6.2s" begin="0.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;0" dur="6.2s" begin="0.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="830" cy="230" r="2" fill="#4ade80" filter="url(#glow-subtle)">
      <animate attributeName="cy" values="255;90;255" dur="5.8s" begin="2.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;0" dur="5.8s" begin="2.1s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Card Border -->
  <rect x="2" y="2" width="956" height="276" rx="16" fill="none" stroke="url(#border-grad)" stroke-width="1.6" />

  <!-- Circuit Traces + Bright Signal Packets -->
  <g stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2" fill="none">
    <path d="M 32 72 L 92 72 L 118 98 L 178 98" />
    <circle cx="178" cy="98" r="2.8" fill="#38bdf8" fill-opacity="0.7" />
    <path d="M 32 182 L 96 182 L 122 156 L 166 156" />
    <circle cx="166" cy="156" r="2.8" fill="#38bdf8" fill-opacity="0.7" />

    <path d="M 928 72 L 868 72 L 842 98 L 782 98" />
    <circle cx="782" cy="98" r="2.8" fill="#818cf8" fill-opacity="0.7" />
    <path d="M 928 182 L 864 182 L 838 156 L 794 156" />
    <circle cx="794" cy="156" r="2.8" fill="#818cf8" fill-opacity="0.7" />
  </g>

  <circle r="3.4" fill="#7dd3fc" filter="url(#glow-subtle)">
    <animateMotion path="M 32 72 L 92 72 L 118 98 L 178 98" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <circle r="3.4" fill="#38bdf8" filter="url(#glow-subtle)">
    <animateMotion path="M 32 182 L 96 182 L 122 156 L 166 156" dur="2.6s" begin="0.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="0.8s" repeatCount="indefinite" />
  </circle>
  <circle r="3.4" fill="#a78bfa" filter="url(#glow-subtle)">
    <animateMotion path="M 928 72 L 868 72 L 842 98 L 782 98" dur="2.4s" begin="0.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="0.4s" repeatCount="indefinite" />
  </circle>
  <circle r="3.4" fill="#a78bfa" filter="url(#glow-subtle)">
    <animateMotion path="M 928 182 L 864 182 L 838 156 L 794 156" dur="2.8s" begin="1.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="1.2s" repeatCount="indefinite" />
  </circle>

  <!-- Top Bar -->
  <g id="top-bar">
    <circle cx="36" cy="28" r="4.5" fill="#ef4444" fill-opacity="0.85" />
    <circle cx="52" cy="28" r="4.5" fill="#eab308" fill-opacity="0.85" />
    <circle cx="68" cy="28" r="4.5" fill="#22c55e" fill-opacity="0.85" />

    <rect x="92" y="18" width="286" height="20" rx="10" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="0.9" />
    <circle cx="105" cy="28" r="3.2" fill="#38bdf8" filter="url(#glow-subtle)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <text x="116" y="32" class="status-text">OPENCLAW // MULTI-LLM ONLINE<tspan fill="#7dd3fc">_<animate attributeName="opacity" values="1;0;1" dur="0.85s" repeatCount="indefinite" /></tspan></text>

    <!-- Available for Hire Badge -->
    <rect x="742" y="18" width="190" height="20" rx="10" fill="#14532d" fill-opacity="0.35" stroke="#22c55e" stroke-opacity="0.55" stroke-width="0.9" />
    <circle cx="756" cy="28" r="3.2" fill="#22c55e" filter="url(#glow-subtle)">
      <animate attributeName="r" values="2.8;4.2;2.8" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <text x="767" y="31.5" class="hire-text">AVAILABLE FOR HIRE • ISB</text>
  </g>

  <!-- Divider + Scanner Sweep -->
  <line x1="28" y1="50" x2="932" y2="50" stroke="#334155" stroke-opacity="0.6" stroke-width="0.8" />
  <rect x="28" y="49" width="180" height="2.2" rx="1.1" fill="url(#sweep-grad)" filter="url(#glow-subtle)">
    <animate attributeName="x" values="28;752;28" dur="4.2s" repeatCount="indefinite" />
  </rect>

  <!-- Main Name -->
  <text x="480" y="106" text-anchor="middle" fill="url(#name-grad)" class="title-text" filter="url(#glow-subtle)">MUHAMMAD MOIZ</text>

  <!-- Cycling Terminal Role Strip -->
  <g transform="translate(170, 122)">
    <rect x="0" y="0" width="620" height="32" rx="8" fill="#0f172a" fill-opacity="0.88" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1" />
    <text x="310" y="21" text-anchor="middle" class="role-text" opacity="1">
      &gt; AI Workflow Automation • OpenClaw + Gemini / Claude / DeepSeek / OpenAI
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.28;0.33;0.66;0.95;0.99;1" dur="9s" repeatCount="indefinite" />
    </text>
    <text x="310" y="21" text-anchor="middle" class="role-text" opacity="0">
      &gt; 24/7 Discord &amp; WhatsApp Bots • Autonomous Linux Server Task Agents
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.28;0.33;0.61;0.66;0.95;1" dur="9s" repeatCount="indefinite" />
    </text>
    <text x="310" y="21" text-anchor="middle" class="role-text" opacity="0">
      &gt; Full-Stack &amp; Desktop Apps • React, Next.js, Node, Firebase, Electron
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.61;0.65;0.66;0.70;0.95;1" dur="9s" repeatCount="indefinite" />
    </text>
  </g>

  <!-- Tech Pills -->
  <g id="pills" transform="translate(0, 174)">
    <g transform="translate(75, 0)">
      <rect x="0" y="0" width="185" height="34" rx="8" fill="url(#pill-grad)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21.5" class="pill-label">Python • C++ • TS</text>
    </g>

    <g transform="translate(275, 0)">
      <rect x="0" y="0" width="205" height="34" rx="8" fill="url(#pill-grad)" stroke="#818cf8" stroke-opacity="0.45" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#818cf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.5s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21.5" class="pill-label">React • Next.js • Node</text>
    </g>

    <g transform="translate(495, 0)">
      <rect x="0" y="0" width="215" height="34" rx="8" fill="url(#pill-grad)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21.5" class="pill-label">OpenClaw • Multi-LLM</text>
    </g>

    <g transform="translate(725, 0)">
      <rect x="0" y="0" width="160" height="34" rx="8" fill="url(#pill-grad)" stroke="#22c55e" stroke-opacity="0.45" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21.5" class="pill-label">Bots • Linux • CEH</text>
    </g>
  </g>

  <!-- Corner Brackets -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M 12 28 L 12 12 L 28 12" />
    <path d="M 948 28 L 948 12 L 932 12" />
    <path d="M 12 252 L 12 268 L 28 268" />
    <path d="M 948 252 L 948 268 L 932 268" />
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite" />
  </g>
</svg>
