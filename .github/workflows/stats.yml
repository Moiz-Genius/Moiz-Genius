name: Update Profile Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/github-stats.svg'
      - 'assets/github-snake-dark.svg'

concurrency:
  group: stats-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Dynamic SVG Stats Card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/generate-stats.py

      - name: Generate Contribution Snake SVG
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#161b22,#0c4a6e,#0284c7,#38bdf8,#818cf8

      - name: Commit and push stats update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-snake-dark.svg
          if git diff --staged --quiet; then
            echo "No changes in stats; skipping commit."
          else
            git commit -m "chore(stats): dynamic metrics and snake refresh [skip ci]"
            git pull --rebase origin main
            git push
          fi
